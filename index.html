<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Randomizer Pro - Kelola Kelas & Offline PWA</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #0b0f19;
      --surface: rgba(30, 41, 59, 0.75);
      --surface-solid: #1e293b;
      --surface-border: rgba(255, 255, 255, 0.12);
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --accent: #10b981;
      --accent-gradient: linear-gradient(135deg, #34d399 0%, #059669 100%);
      --danger: #ef4444;
      --danger-gradient: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
      --gold: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; max-width: 100vw; overflow-x: hidden; }
    body {
      background: var(--bg);
      background-image: radial-gradient(at 50% 0%, rgba(99,102,241,0.2) 0px, transparent 60%), radial-gradient(at 100% 100%, rgba(16,185,129,0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      padding: calc(8px + var(--safe-top)) calc(8px + var(--safe-right)) calc(8px + var(--safe-bottom)) calc(8px + var(--safe-left));
      min-height: 100vh;
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      font-size: 16px; line-height: 1.35;
      -webkit-font-smoothing: antialiased;
    }
    header {
      width: 100%; max-width: 600px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px;
      background: var(--surface);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      margin-bottom: 10px; gap: 6px;
    }
    .brand { display: flex; align-items: center; gap: 6px; font-size: clamp(0.82rem, 3.4vw, 1rem); font-weight: 800; color: #fff; min-width: 0; flex: 1 1 auto; overflow: hidden; }
    .brand > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-badge { font-size: 0.6rem; padding: 2px 6px; border-radius: 20px; background: rgba(16,185,129,0.15); color: var(--accent); border: 1px solid rgba(16,185,129,0.3); font-weight: 600; flex-shrink: 0; white-space: nowrap; }
    .header-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .header-actions button { padding: 6px 9px !important; font-size: 0.78rem; }
    .hide-xs { display: inline; }
    .show-xs { display: none; }
    main { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 10px; }
    .display-card, .card { background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--surface-border); border-radius: var(--radius); padding: 12px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
    .display-card { text-align: center; padding: 14px; }
    .display-box { background: linear-gradient(180deg, rgba(15,23,42,0.8) 0%, rgba(11,15,25,0.9) 100%); border: 2px dashed rgba(99,102,241,0.4); border-radius: var(--radius); min-height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px; margin-bottom: 12px; transition: all 0.3s ease; overflow: hidden; }
    .display-box.rolling { border-color: var(--accent); box-shadow: 0 0 25px rgba(16,185,129,0.3); animation: pulseGlow 0.8s infinite alternate; }
    .display-box.winner-found { border-color: var(--gold); box-shadow: 0 0 30px rgba(245,158,11,0.4); animation: victoryShake 0.4s ease-in-out; }
    .winner-text { font-size: clamp(1.3rem, 6.5vw, 1.8rem); font-weight: 800; color: #fff; word-break: break-word; overflow-wrap: anywhere; line-height: 1.2; width: 100%; }
    .winner-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; }
    .btn-main { background: var(--accent-gradient); color: #fff; border: none; min-height: 52px; padding: 12px; border-radius: 14px; font-weight: 800; font-size: 1.05rem; cursor: pointer; width: 100%; box-shadow: 0 6px 20px rgba(16,185,129,0.35); transition: transform 0.15s ease; display: flex; align-items: center; justify-content: center; gap: 8px; touch-action: manipulation; }
    .btn-main:active { transform: scale(0.96); }
    .quick-options { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: rgba(11,15,25,0.6); padding: 8px 10px; border-radius: 10px; border: 1px solid var(--surface-border); font-size: 0.78rem; margin-top: 10px; flex-wrap: wrap; }
    .quick-options label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text); min-width: 0; flex: 1 1 auto; }
    .quick-options label input { flex-shrink: 0; }
    .quick-options button { font-size: 0.72rem !important; padding: 5px 8px !important; flex-shrink: 0; }
    .tabs { display: flex; border-bottom: 1px solid var(--surface-border); margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-item { padding: 8px 10px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-muted); font-weight: 700; font-size: 0.82rem; flex: 1; text-align: center; white-space: nowrap; transition: color 0.2s, border-color 0.2s; }
    .tab-item.active { border-color: var(--primary); color: #fff; }
    .list-container { max-height: 200px; overflow-y: auto; list-style: none; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .list-item { background: rgba(11,15,25,0.6); padding: 9px 11px; border-radius: 8px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.84rem; border: 1px solid rgba(255,255,255,0.05); word-break: break-word; }
    .list-item > span { min-width: 0; overflow-wrap: anywhere; }
    .list-item small { flex-shrink: 0; }
    button { background: var(--primary-gradient); color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 0.82rem; touch-action: manipulation; white-space: nowrap; }
    button.btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid var(--surface-border); color: var(--text); }
    button.btn-danger { background: var(--danger-gradient); }
    .winners-actions { display: flex; gap: 6px; margin-top: 10px; }
    .winners-actions button { flex: 1; min-width: 0; padding: 9px 6px; font-size: 0.78rem; }
    .groups-toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .groups-toolbar label { font-size: 0.8rem; white-space: nowrap; }
    .groups-toolbar input[type="number"] { width: 60px; padding: 8px; background: rgba(11,15,25,0.7); border: 1px solid var(--surface-border); color: #fff; border-radius: 8px; font-size: 16px; }
    .groups-toolbar button { min-height: 40px; padding: 8px 14px; font-size: 0.85rem; margin-left: auto; }
    #groupsGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; max-height: 220px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .group-card { background: rgba(11,15,25,0.6); border: 1px solid var(--surface-border); border-radius: 8px; padding: 8px; }
    .group-card h4 { border-bottom: 1px solid var(--surface-border); padding-bottom: 3px; font-size: 0.78rem; color: var(--accent); margin-bottom: 4px; }
    .group-card ul { list-style: none; font-size: 0.76rem; }
    .group-card ul li { overflow-wrap: anywhere; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: calc(10px + var(--safe-top)) calc(10px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(10px + var(--safe-left)); opacity: 0; transition: opacity 0.25s ease; }
    .modal-overlay.open { display: flex; opacity: 1; }
    .modal { background: var(--surface-solid); border: 1px solid var(--surface-border); border-radius: var(--radius); width: 100%; max-width: 500px; padding: 14px; max-height: calc(100dvh - 20px - var(--safe-top) - var(--safe-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; transform: scale(0.95); transition: transform 0.25s ease; }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .modal-header h3 { font-size: 0.95rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    textarea, input[type="text"], input[type="number"], select { width: 100%; background: rgba(11,15,25,0.7); border: 1px solid var(--surface-border); border-radius: 10px; color: var(--text); padding: 10px; font-size: 16px; outline: none; margin: 6px 0; -webkit-appearance: none; appearance: none; }
    textarea { height: 120px; resize: vertical; font-family: inherit; }
    textarea:focus, input:focus, select:focus { border-color: var(--primary); }
    .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    .btn-grid button { padding: 10px 6px; font-size: 0.78rem; }
    .class-toolbar { background: rgba(11,15,25,0.6); padding: 10px; border-radius: 10px; border: 1px solid var(--surface-border); margin-bottom: 10px; }
    .class-toolbar .row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .class-toolbar select { flex: 1 1 120px; margin: 0; }
    .class-toolbar button { flex-shrink: 0; }
    @keyframes pulseGlow { from { box-shadow: 0 0 10px rgba(16,185,129,0.2); } to { box-shadow: 0 0 25px rgba(16,185,129,0.5); } }
    @keyframes victoryShake { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.05) rotate(-2deg); } 40% { transform: scale(1.05) rotate(2deg); } }
    @media (max-width: 480px) {
      .hide-xs { display: none; }
      .show-xs { display: inline; }
      header { padding: 7px 9px; }
      .status-badge { display: none; }
      .display-box { min-height: 115px; padding: 12px; }
      .winners-actions button { font-size: 0.72rem; padding: 8px 4px; }
    }
    @media (max-width: 360px) {
      .tab-item { font-size: 0.75rem; padding: 8px 6px; }
      .btn-grid button { font-size: 0.72rem; }
      .winners-actions { flex-wrap: wrap; }
      .winners-actions button { flex: 1 1 calc(50% - 3px); }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .display-box { min-height: 90px; padding: 10px; }
      .winner-text { font-size: 1.25rem; }
      .btn-main { min-height: 46px; font-size: 1rem; }
      header { margin-bottom: 8px; }
    }
  </style>
  <script src="xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <span>🎲 Randomizer Pro</span>
      <span class="status-badge">⚡ Offline</span>
    </div>
    <div class="header-actions">
      <button onclick="toggleFullScreen()" class="btn-secondary" title="Fullscreen" aria-label="Fullscreen">📺</button>
      <button onclick="openSettings()" class="btn-secondary" aria-label="Kelola Data">
        <span class="hide-xs">⚙️ Kelola Data / Kelas</span>
        <span class="show-xs">⚙️ Kelola</span>
      </button>
    </div>
  </header>

  <main>
    <section class="display-card">
      <div class="display-box" id="displayBox">
        <div class="winner-text" id="winnerText">Siap Mengacak</div>
        <div class="winner-sub" id="winnerSub">Tekan tombol di bawah untuk memilih nama</div>
      </div>
      <button onclick="pickWinner()" class="btn-main">🎯 ACAK NAMA NOW</button>
      <div class="quick-options">
        <label><input type="checkbox" id="removeOnPick"> 🚫 Jangan ulangi nama terpilih</label>
        <button onclick="resetOriginalData()" class="btn-secondary">🔄 Restore Data</button>
      </div>
    </section>

    <section class="card">
      <div class="tabs">
        <div class="tab-item active" onclick="switchTab('tabWinners', this)">🏆 Terpilih</div>
        <div class="tab-item" onclick="switchTab('tabGroups', this)">👥 Bagi Kelompok</div>
      </div>
      <div id="tabWinners">
        <ul class="list-container" id="winnersList"></ul>
        <div class="winners-actions">
          <button onclick="shareToWhatsApp()" class="btn-secondary">💬 Share WA</button>
          <button onclick="exportWinnersExcel()" class="btn-secondary">📊 Excel</button>
          <button onclick="clearWinnersHistory()" class="btn-danger">🗑️ Hapus</button>
        </div>
      </div>
      <div id="tabGroups" style="display:none;">
        <div class="groups-toolbar">
          <label>Jumlah Kelompok:</label>
          <input type="number" id="groupCount" min="2" value="3">
          <button onclick="generateGroups()">Bagi</button>
        </div>
        <div id="groupsGrid"></div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h3>⚙️ Kelola Data & Sesi Kelas</h3>
        <button onclick="closeSettings()" class="btn-secondary" style="padding:5px 10px;">✕ Tutup</button>
      </div>
      <div class="tabs" style="margin-bottom:10px;">
        <div class="tab-item active" onclick="switchModalTab('mTabClass', this)">🏫 Kelola Kelas</div>
        <div class="tab-item" onclick="switchModalTab('mTabInput', this)">📝 Input Manual</div>
      </div>
      <div id="mTabClass">
        <div class="class-toolbar">
          <label style="font-size:0.8rem; color:var(--text-muted);">Pilih / Tambah Kelas Baru:</label>
          <div class="row">
            <select id="classSelect" onchange="loadClassStudents()">
              <option value="">-- Pilih Kelas --</option>
            </select>
            <button onclick="addNewClass()" class="btn-secondary">➕ Buat Kelas</button>
            <button onclick="deleteCurrentClass()" class="btn-danger" style="padding:6px 10px;" aria-label="Hapus kelas">🗑️</button>
          </div>
        </div>
        <div id="classEditor" style="display:none;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px;">
            <span style="font-size:0.8rem; color:var(--text-muted);">Daftar Siswa Kelas Ini:</span>
            <strong id="classStudentCount" style="font-size:0.8rem; color:var(--accent);">0 Siswa</strong>
          </div>
          <textarea id="classStudentsInput" oninput="saveClassStudents()" placeholder="Ketik nama-nama siswa (1 baris 1 siswa)"></textarea>
          <button onclick="applyClassToMain()" class="btn-main" style="min-height:44px; font-size:0.9rem; margin-top:8px;">🚀 Muat ke Pengacak Utama</button>
        </div>
      </div>
      <div id="mTabInput" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:0.8rem; color:var(--text-muted);">
          <span>Data Pengacak Saat Ini:</span>
          <strong id="itemCount" style="color:var(--accent); white-space:nowrap;">Total: 0 Peserta</strong>
        </div>
        <textarea id="dataInput" oninput="updateItemCount(); saveCurrentSession();" placeholder="Ahmad&#10;Budi&#10;Siti&#10;-Joko (Awalan - = Skip/Absen)"></textarea>
        <div class="btn-grid">
          <button onclick="shuffleData()" class="btn-secondary">🔀 Kocok Baris</button>
          <button onclick="sortData()" class="btn-secondary">🔤 Urut A-Z</button>
          <button onclick="genKupon()" class="btn-secondary">🔢 Buat Kupon</button>
          <button onclick="triggerExcel()" class="btn-secondary">📂 Import Excel</button>
        </div>
        <input type="file" id="excelInput" accept=".xlsx, .xls" style="display:none" onchange="importExcelData(event)">
      </div>
      <hr style="border:0; border-top:1px solid var(--surface-border); margin:12px 0;">
      <div style="display:flex; flex-direction:column; gap:8px; font-size:0.82rem;">
        <label style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="soundToggle" checked> Aktifkan Suara Beep & Fanfare
        </label>
        <div>
          <label style="color:var(--text-muted);">Durasi Roll Animasi (Detik):</label>
          <input type="number" id="rollDuration" value="2.5" step="0.5" min="1">
        </div>
      </div>
    </div>
  </div>

  <script>
    const DB_NAME = 'RandomizerProDB';
    const DB_VERSION = 2;
    let db, backupOriginalData = "";

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains('classes')) db.createObjectStore('classes', { keyPath: 'id' });
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(); };
        request.onerror = (e) => reject(e);
      });
    }

    function triggerVibration(pattern = [50]) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function playBeep(freq = 400, type = 'sine', duration = 0.05) {
      const toggle = document.getElementById('soundToggle');
      if (toggle && !toggle.checked) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type; osc.frequency.value = freq;
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function playFanfare() {
      const toggle = document.getElementById('soundToggle');
      if (toggle && !toggle.checked) return;
      const notes = [261, 329, 392, 523, 659];
      notes.forEach((freq, i) => setTimeout(() => playBeep(freq, 'triangle', 0.18), i * 90));
    }

    let winnersList = [];

    function getDataList() {
      const text = document.getElementById('dataInput').value;
      return text.split('\n').map(s => s.trim()).filter(s => s.length > 0 && !s.startsWith('-'));
    }

    function updateItemCount() {
      const count = getDataList().length;
      document.getElementById('itemCount').innerText = `Total: ${count} Peserta`;
    }

    function pickWinner() {
      const items = getDataList();
      if (items.length === 0) {
        document.getElementById('winnerText').innerText = "Data Kosong!";
        document.getElementById('winnerSub').innerText = "Buka Kelola Data/Kelas untuk memilih peserta";
        triggerVibration([100, 50, 100]);
        return;
      }

      if(!backupOriginalData) backupOriginalData = document.getElementById('dataInput').value;

      const duration = parseFloat(document.getElementById('rollDuration').value) * 1000 || 2500;
      const intervalTime = 60;
      let elapsed = 0;

      const displayBox = document.getElementById('displayBox');
      const wText = document.getElementById('winnerText');
      const wSub = document.getElementById('winnerSub');

      displayBox.className = 'display-box rolling';
      wSub.innerText = "Mengacak nama...";
      triggerVibration([30]);

      const timer = setInterval(() => {
        const randIdx = Math.floor(Math.random() * items.length);
        wText.innerText = items[randIdx];
        playBeep(300 + Math.random() * 250, 'sine', 0.03);
        elapsed += intervalTime;

        if (elapsed >= duration) {
          clearInterval(timer);
          const winnerIndex = Math.floor(Math.random() * items.length);
          const winner = items[winnerIndex];

          displayBox.className = 'display-box winner-found';
          wText.innerText = winner;
          wSub.innerText = "🎉 Terpilih!";

          playFanfare();
          triggerVibration([100, 50, 200]);

          addWinnerRecord(winner);
          if (document.getElementById('removeOnPick').checked) removePickedItem(winner);

          if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        }
      }, intervalTime);
    }

    function removePickedItem(item) {
      let lines = document.getElementById('dataInput').value.split('\n');
      let idx = lines.findIndex(l => l.trim() === item);
      if (idx !== -1) {
        lines.splice(idx, 1);
        document.getElementById('dataInput').value = lines.join('\n');
        updateItemCount();
        saveCurrentSession();
      }
    }

    function resetOriginalData() {
      if (backupOriginalData) {
        document.getElementById('dataInput').value = backupOriginalData;
        updateItemCount();
        saveCurrentSession();
        triggerVibration([50, 50]);
        alert("Daftar nama dikembalikan!");
      }
    }

    function addWinnerRecord(name) {
      const record = { name, time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) };
      winnersList.unshift(record);
      renderWinnersUI();
    }

    function renderWinnersUI() {
      const container = document.getElementById('winnersList');
      container.innerHTML = winnersList.map((w, i) => `
        <li class="list-item">
          <span><strong>#${winnersList.length - i}</strong> ${w.name}</span>
          <small style="color:var(--text-muted);">${w.time}</small>
        </li>
      `).join('');
    }

    function clearWinnersHistory() { winnersList = []; renderWinnersUI(); }

    function shareToWhatsApp() {
      if (winnersList.length === 0) return alert("Belum ada pemenang yang terpilih!");
      let text = "*🏆 DAFTAR PEMENANG TERPILIH 🏆*\n\n";
      winnersList.forEach((w, i) => { text += `${i+1}. ${w.name} (${w.time})\n`; });

      if (navigator.share) {
        navigator.share({ title: 'Hasil Pengacak', text: text });
      } else {
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function loadClassesList() {
      const tx = db.transaction('classes', 'readonly');
      const store = tx.objectStore('classes');
      const req = store.getAll();
      req.onsuccess = () => {
        const select = document.getElementById('classSelect');
        select.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        req.result.forEach(c => {
          select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        });
      };
    }

    function addNewClass() {
      const name = prompt("Masukkan Nama Kelas/Kelompok (contoh: Kelas 10-A):");
      if (!name) return;
      const id = 'class_' + Date.now();
      const tx = db.transaction('classes', 'readwrite');
      tx.objectStore('classes').put({ id, name, students: "" });
      tx.oncomplete = () => {
        loadClassesList();
        setTimeout(() => {
          document.getElementById('classSelect').value = id;
          loadClassStudents();
        }, 100);
      };
    }

    function loadClassStudents() {
      const id = document.getElementById('classSelect').value;
      const editor = document.getElementById('classEditor');
      if (!id) {
        editor.style.display = 'none';
        return;
      }
      editor.style.display = 'block';

      const tx = db.transaction('classes', 'readonly');
      const store = tx.objectStore('classes');
      const req = store.get(id);
      req.onsuccess = () => {
        if (req.result) {
          document.getElementById('classStudentsInput').value = req.result.students || "";
          updateClassCount();
        }
      };
    }

    function saveClassStudents() {
      const id = document.getElementById('classSelect').value;
      if (!id) return;
      const students = document.getElementById('classStudentsInput').value;

      const tx = db.transaction('classes', 'readonly');
      const store = tx.objectStore('classes');
      const req = store.get(id);
      req.onsuccess = () => {
        if (req.result) {
          const item = req.result;
          item.students = students;
          const writeTx = db.transaction('classes', 'readwrite');
          writeTx.objectStore('classes').put(item);
        }
      };
      updateClassCount();
    }

    function updateClassCount() {
      const text = document.getElementById('classStudentsInput').value;
      const count = text.split('\n').map(s => s.trim()).filter(s => s.length > 0).length;
      document.getElementById('classStudentCount').innerText = `${count} Siswa`;
    }

    function deleteCurrentClass() {
      const id = document.getElementById('classSelect').value;
      if (!id) return alert("Pilih kelas yang ingin dihapus!");
      if (confirm("Apakah Anda yakin ingin menghapus kelas ini?")) {
        const tx = db.transaction('classes', 'readwrite');
        tx.objectStore('classes').delete(id);
        tx.oncomplete = () => {
          document.getElementById('classEditor').style.display = 'none';
          loadClassesList();
        };
      }
    }

    function applyClassToMain() {
      const students = document.getElementById('classStudentsInput').value;
      if (!students.trim()) return alert("Daftar siswa kelas ini masih kosong!");
      document.getElementById('dataInput').value = students;
      backupOriginalData = students;
      updateItemCount();
      saveCurrentSession();
      closeSettings();
      triggerVibration([50]);
      alert("Siswa berhasil dimuat ke pengacak utama!");
    }

    function switchModalTab(tabId, el) {
      document.getElementById('mTabClass').style.display = tabId === 'mTabClass' ? 'block' : 'none';
      document.getElementById('mTabInput').style.display = tabId === 'mTabInput' ? 'block' : 'none';
      el.parentElement.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }

    function shuffleData() {
      let items = getDataList();
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      document.getElementById('dataInput').value = items.join('\n');
      saveCurrentSession();
    }

    function sortData() {
      let items = getDataList().sort((a, b) => a.localeCompare(b));
      document.getElementById('dataInput').value = items.join('\n');
      saveCurrentSession();
    }

    function genKupon() {
      const start = parseInt(prompt("Angka awal:", "1"));
      const end = parseInt(prompt("Angka akhir:", "50"));
      if (isNaN(start) || isNaN(end) || start >= end) return;
      let list = [];
      for (let i = start; i <= end; i++) list.push(`Kupon #${i}`);
      document.getElementById('dataInput').value = list.join('\n');
      updateItemCount();
      saveCurrentSession();
    }

    function generateGroups() {
      const items = getDataList();
      const numGroups = parseInt(document.getElementById('groupCount').value);
      if (items.length === 0 || isNaN(numGroups) || numGroups < 1) return;

      let shuffled = [...items].sort(() => 0.5 - Math.random());
      let groups = Array.from({ length: numGroups }, () => []);
      shuffled.forEach((item, index) => groups[index % numGroups].push(item));

      const grid = document.getElementById('groupsGrid');
      grid.innerHTML = groups.map((g, i) => `
        <div class="group-card">
          <h4>Kelompok ${i + 1} (${g.length})</h4>
          <ul>${g.map(name => `<li>• ${name}</li>`).join('')}</ul>
        </div>
      `).join('');
    }

    function triggerExcel() { document.getElementById('excelInput').click(); }

    function importExcelData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        let names = [];
        json.forEach(row => { row.forEach(cell => { if (cell) names.push(cell.toString().trim()); }); });
        document.getElementById('dataInput').value = names.join('\n');
        updateItemCount();
        saveCurrentSession();
      };
      reader.readAsArrayBuffer(file);
    }

    function exportWinnersExcel() {
      if (winnersList.length === 0) return alert("Belum ada riwayat pemenang!");
      const data = winnersList.map((w, i) => ({ No: i + 1, Nama: w.name, Waktu: w.time }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Pemenang");
      XLSX.writeFile(wb, "Riwayat_Pemenang.xlsx");
    }

    function saveCurrentSession() { localStorage.setItem('randomizer_last_session', document.getElementById('dataInput').value); }

    function loadLastSession() {
      const saved = localStorage.getItem('randomizer_last_session');
      if (saved !== null) {
        document.getElementById('dataInput').value = saved;
        backupOriginalData = saved;
        updateItemCount();
      }
    }

    function switchTab(tabId, el) {
      document.getElementById('tabWinners').style.display = tabId === 'tabWinners' ? 'block' : 'none';
      document.getElementById('tabGroups').style.display = tabId === 'tabGroups' ? 'block' : 'none';
      el.parentElement.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }

    function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }

    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      loadClassesList();
      loadLastSession();
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  </script>
</body>
</html>
