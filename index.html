<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acak Universal & Siswa - PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <style>
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --accent-color: #10b981;
      --border-color: #e5e7eb;
      --danger-color: #ef4444;
    }
    body.dark-mode {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --accent-color: #34d399;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
      transition: background-color 0.3s, color 0.3s;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
    }
    
    /* Responsive Layout Grid */
    .app-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 140px;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: inherit;
      resize: vertical;
    }
    .grid-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 12px 0;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
      flex: 1 1 auto;
    }
    button:hover { background-color: var(--primary-hover); }
    button.btn-accent { background-color: var(--accent-color); }
    button.btn-danger { background-color: var(--danger-color); }
    .result-box {
      font-size: 2.2rem;
      font-weight: 800;
      text-align: center;
      padding: 30px;
      margin: 16px 0;
      background-color: var(--bg-color);
      border: 2px dashed var(--primary-color);
      border-radius: 12px;
      color: var(--primary-color);
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }
    .winners-list {
      list-style: none;
      padding: 0;
      max-height: 250px;
      overflow-y: auto;
    }
    .winners-list li {
      padding: 8px 12px;
      background: var(--bg-color);
      margin-bottom: 6px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
    }
    .group-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    .group-card {
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      background-color: var(--bg-color);
    }
    .tab-btn {
      background: none;
      color: var(--text-color);
      border-bottom: 3px solid transparent;
      border-radius: 0;
      padding: 8px 16px;
    }
    .tab-btn.active {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }
  </style>
  <script src="xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <header>
    <h1>🎲 Acak Universal & Siswa</h1>
    <div>
      <button onclick="toggleTheme()">🌓 Tema</button>
    </div>
  </header>

  <main class="app-layout">
    <!-- Kolom Kiri: Input & Kontrol -->
    <div class="column-left">
      <section class="card">
        <label for="studentInput"><strong>Daftar Nama / Peserta / Items (1 data per baris):</strong></label>
        <textarea id="studentInput" placeholder="Ahmad&#10;Budi&#10;Siti&#10;Dewi&#10;-Eko (Tanda - untuk Absen/Skip)"></textarea>
        
        <div class="grid-options">
          <div>
            <label><input type="checkbox" id="removeOnPick"> Hapus jika terpilih (Undian)</label>
          </div>
          <div>
            <label><input type="checkbox" id="soundEffect" checked> Efek Suara</label>
          </div>
        </div>

        <div class="btn-group">
          <button onclick="pickRandom()" class="btn-accent">🎲 Acak 1 Nama</button>
          <button onclick="pickMultiple()">🎲 Acak N Nama</button>
          <button onclick="shuffleList()">🔀 Kocok Daftar</button>
          <button onclick="sortList()">🔤 Urut A-Z</button>
          <button onclick="generateNumbers()">🔢 Buat Kupon</button>
          <button onclick="importExcel()">📂 Impor Excel</button>
        </div>
        <input type="file" id="excelFile" accept=".xlsx, .xls" style="display:none" onchange="handleExcel(event)">
      </section>
    </div>

    <!-- Kolom Kanan: Hasil & Tab Pemenang/Kelompok -->
    <div class="column-right">
      <section class="card">
        <h2>Hasil Acakan</h2>
        <div class="result-box" id="resultDisplay">Siap Mengacak!</div>
      </section>

      <section class="card">
        <div style="display: flex; gap: 10px; margin-bottom: 12px;">
          <button class="tab-btn active" onclick="switchTab('winnersTab', event)">🏆 Pemenang/Terpilih</button>
          <button class="tab-btn" onclick="switchTab('groupsTab', event)">👥 Bagi Kelompok</button>
        </div>

        <div id="winnersTab">
          <ul id="winnersList" class="winners-list"></ul>
          <button onclick="clearWinners()" class="btn-danger" style="margin-top: 10px;">Riset Pemenang</button>
        </div>

        <div id="groupsTab" style="display: none;">
          <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px;">
            <label for="groupCount">Jumlah Kelompok:</label>
            <input type="number" id="groupCount" min="2" value="3" style="padding: 6px; width: 60px;">
            <button onclick="makeGroups()">Bagi Kelompok</button>
          </div>
          <div id="groupsContainer" class="group-container"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    let winners = [];

    function playBeep(freq = 440, duration = 0.1) {
      if (!document.getElementById('soundEffect').checked) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function getItems() {
      const text = document.getElementById('studentInput').value;
      return text.split('\n')
        .map(s => s.trim())
        .filter(s => s.length > 0 && !s.startsWith('-'));
    }

    function pickRandom() {
      const items = getItems();
      if (items.length === 0) {
        document.getElementById('resultDisplay').innerText = "Daftar Kosong!";
        return;
      }

      let count = 0;
      const display = document.getElementById('resultDisplay');
      const interval = setInterval(() => {
        const randIndex = Math.floor(Math.random() * items.length);
        display.innerText = items[randIndex];
        playBeep(300 + (count * 20), 0.05);
        count++;

        if (count > 20) {
          clearInterval(interval);
          const finalIndex = Math.floor(Math.random() * items.length);
          const winner = items[finalIndex];
          display.innerText = "🎉 " + winner;
          playBeep(880, 0.4);

          addWinner(winner);
          if (document.getElementById('removeOnPick').checked) {
            removeItemFromInput(winner);
          }

          if (typeof confetti === 'function') {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          }
        }
      }, 70);
    }

    function pickMultiple() {
      const items = getItems();
      const num = prompt("Berapa nama/item yang ingin diacak sekaligus?", "3");
      const count = parseInt(num);
      if (isNaN(count) || count <= 0) return;

      if (items.length < count) {
        alert("Jumlah item di daftar kurang dari jumlah yang diminta!");
        return;
      }

      let shuffled = [...items].sort(() => 0.5 - Math.random());
      let selected = shuffled.slice(0, count);
      
      document.getElementById('resultDisplay').innerHTML = selected.join("<br>");
      selected.forEach(item => {
        addWinner(item);
        if (document.getElementById('removeOnPick').checked) removeItemFromInput(item);
      });
      
      if (typeof confetti === 'function') confetti({ particleCount: 100 });
    }

    function removeItemFromInput(item) {
      let lines = document.getElementById('studentInput').value.split('\n');
      let index = lines.findIndex(l => l.trim() === item);
      if (index !== -1) {
        lines.splice(index, 1);
        document.getElementById('studentInput').value = lines.join('\n');
      }
    }

    function addWinner(name) {
      winners.push(name);
      renderWinners();
    }

    function renderWinners() {
      const list = document.getElementById('winnersList');
      list.innerHTML = winners.map((w, i) => `<li><span>#${i+1} ${w}</span></li>`).join('');
    }

    function clearWinners() {
      winners = [];
      renderWinners();
    }

    function shuffleList() {
      const items = getItems();
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      document.getElementById('studentInput').value = items.join('\n');
    }

    function sortList() {
      const items = getItems().sort((a, b) => a.localeCompare(b));
      document.getElementById('studentInput').value = items.join('\n');
    }

    function generateNumbers() {
      const start = parseInt(prompt("Nomor Awal:", "1"));
      const end = parseInt(prompt("Nomor Akhir:", "50"));
      if (isNaN(start) || isNaN(end) || start >= end) return;

      let nums = [];
      for (let i = start; i <= end; i++) nums.push("Kupon #" + i);
      document.getElementById('studentInput').value = nums.join('\n');
    }

    function makeGroups() {
      const items = getItems();
      const numGroups = parseInt(document.getElementById('groupCount').value);
      if (items.length === 0 || isNaN(numGroups) || numGroups <= 0) return;

      let shuffled = [...items].sort(() => 0.5 - Math.random());
      let groups = Array.from({ length: numGroups }, () => []);

      shuffled.forEach((item, index) => {
        groups[index % numGroups].push(item);
      });

      const container = document.getElementById('groupsContainer');
      container.innerHTML = groups.map((g, i) => `
        <div class="group-card">
          <strong>Kelompok ${i + 1} (${g.length})</strong>
          <ul style="margin-top:8px; padding-left:16px;">
            ${g.map(name => `<li>${name}</li>`).join('')}
          </ul>
        </div>
      `).join('');
    }

    function switchTab(tabId, evt) {
      document.getElementById('winnersTab').style.display = tabId === 'winnersTab' ? 'block' : 'none';
      document.getElementById('groupsTab').style.display = tabId === 'groupsTab' ? 'block' : 'none';
      
      const btns = document.querySelectorAll('.tab-btn');
      btns.forEach(b => b.classList.remove('active'));
      if(evt) evt.target.classList.add('active');
    }

    function importExcel() {
      document.getElementById('excelFile').click();
    }

    function handleExcel(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
        
        let names = [];
        json.forEach(row => {
          row.forEach(cell => {
            if (cell) names.push(cell.toString().trim());
          });
        });
        document.getElementById('studentInput').value = names.join('\n');
      };
      reader.readAsArrayBuffer(file);
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
